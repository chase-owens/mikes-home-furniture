name: Deploy Vinteeks Client App

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-2
      WEB_BUCKET: vinteeks-web-prod
      CLOUDFRONT_DISTRIBUTION_ID: EWGHSI60I7KOH
      PUBLIC_CONTENT_BASE_URL: https://d7r9an6gzs271.cloudfront.net

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create env file
        run: |
          echo "PUBLIC_CONTENT_BASE_URL=/data" >> .env
          echo "PUBLIC_CONTACT_API_URL=https://n5k7mx128f.execute-api.us-east-1.amazonaws.com/contact" >> .env
          echo "PUBLIC_UPLOAD_URL_API=https://n5k7mx128f.execute-api.us-east-1.amazonaws.com/inquiries/upload-url" >> .env

      - name: Check
        run: npm run check --if-present

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync ./build s3://$WEB_BUCKET --delete
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
